<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" role="img" aria-labelledby="title desc">
  <title id="title">Orange and Gemini logo</title>
  <desc id="desc">A bright orange beside the multicolor Gemini sparkle and Gemini wordmark.</desc>
  <defs>
    <radialGradient id="orange" cx="32%" cy="25%" r="75%">
      <stop offset="0" stop-color="#ffbf45"/>
      <stop offset="0.55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#e85d04"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#78b943"/>
      <stop offset="1" stop-color="#2f7d32"/>
    </linearGradient>
    <linearGradient id="gemini" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00bfa5"/>
      <stop offset="0.3" stop-color="#1688f8"/>
      <stop offset="0.68" stop-color="#7c67e8"/>
      <stop offset="1" stop-color="#ff4d67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7a3100" flood-opacity=".2"/>
    </filter>
  </defs>

  <g transform="translate(18 13)" filter="url(#shadow)">
    <circle cx="75" cy="88" r="57" fill="url(#orange)"/>
    <path d="M72 31c4-14 12-22 25-29" fill="none" stroke="#74451d" stroke-width="7" stroke-linecap="round"/>
    <path d="M91 19C105 2 129 3 139 9c-9 18-30 27-48 10Z" fill="url(#leaf)"/>
    <ellipse cx="54" cy="62" rx="14" ry="9" fill="#fff" opacity=".2" transform="rotate(-35 54 62)"/>
  </g>

  <path d="M202 27c7 37 28 58 65 65-37 7-58 28-65 65-7-37-28-58-65-65 37-7 58-28 65-65Z" fill="url(#gemini)"/>
  <text x="282" y="120" fill="#171717" font-family="Google Sans, Product Sans, Arial, sans-serif" font-size="82" font-weight="500" letter-spacing="-3">Gemini</text>
</svg>
